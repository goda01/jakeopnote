<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"/>
<meta name="apple-mobile-web-app-capable" content="yes"/>
<meta name="apple-mobile-web-app-title" content="작업노트"/>
<meta name="theme-color" content="#000"/>
<link rel="apple-touch-icon" href="icon-192.png"/>
<title>작업노트</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+KR:wght@400;600;700&family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{--bg:#000;--sf:#0a0a0a;--card:#111;--hv:#181818;--br:#2a2a2a;--mt:#666;--sb:#999;--tx:#fff;--ac:#9b7fe8;--ad:rgba(155,127,232,.12)}
html,body{height:100%;height:100dvh;background:#000;color:#fff;font-family:"Noto Sans KR",sans-serif;font-size:14px;overflow:hidden}
::-webkit-scrollbar{width:3px}::-webkit-scrollbar-thumb{background:var(--br);border-radius:2px}
.app{display:flex;height:100vh;height:100dvh;overflow:hidden}
.sb{width:256px;min-width:256px;background:var(--sf);border-right:1px solid var(--br);display:flex;flex-direction:column;transition:width .2s,min-width .2s,opacity .2s;overflow:hidden;height:100vh;height:100dvh}
.sb.closed{width:0;min-width:0;opacity:0;pointer-events:none}
.sbh{padding:18px 16px 14px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.logo{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;color:var(--ac);display:flex;align-items:center;gap:8px;white-space:nowrap}
.logo-sub{font-size:9px;color:#999999;letter-spacing:3px;font-family:"Noto Sans KR",sans-serif;margin-top:2px}
.x-btn{background:none;border:none;color:var(--mt);cursor:pointer;font-size:16px;padding:2px 4px;border-radius:4px}
.x-btn:hover{color:#fff}
.new-btn{margin:10px 12px 6px;padding:9px;background:none;border:1px dashed #444;border-radius:6px;color:#aaaaaa;font-family:"Noto Sans KR",sans-serif;font-size:12px;cursor:pointer;transition:all .15s}
.new-btn:hover{border-color:var(--ac);color:var(--ac);background:var(--ad)}
.sb-list{flex:1;overflow-y:auto;padding:4px 0}
.si{padding:8px 12px 8px 14px;cursor:pointer;border-left:2px solid transparent;display:flex;align-items:center;gap:10px;transition:all .12s;overflow:hidden}
.si:hover{background:var(--hv)}
.si.on{border-left-color:var(--ac);background:var(--ad)}
.del-btn{background:none;border:none;color:var(--mt);cursor:pointer;font-size:12px;padding:2px 5px;border-radius:3px;flex-shrink:0;opacity:0;transition:opacity .15s}
.si:hover .del-btn{opacity:1}
.del-btn:hover{color:#f44336;background:rgba(244,67,54,.15)}
.icon-btn{background:none;border:none;cursor:pointer;font-size:13px;padding:2px 4px;border-radius:4px;opacity:0.5;transition:all .15s}
.icon-btn:hover{opacity:1;background:rgba(255,255,255,.1)}
.si-title{font-size:13px;font-weight:500;color:#ffffff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.si-meta{font-size:10px;color:var(--mt);margin-top:2px}
.si-cover{width:36px;height:50px;border-radius:4px;object-fit:cover;flex-shrink:0;border:1px solid var(--br)}
.si-cover-empty{width:36px;height:50px;border-radius:4px;background:var(--card);border:1px solid var(--br);display:flex;align-items:center;justify-content:center;font-size:16px;flex-shrink:0}
.sb-foot{padding:12px 16px;border-top:1px solid var(--br);display:flex;flex-shrink:0}
.trash-btn{margin:0 12px 10px;padding:8px;background:none;border:1px solid var(--br);border-radius:6px;color:var(--mt);font-family:"Noto Sans KR",sans-serif;font-size:11px;cursor:pointer;transition:all .15s;width:calc(100% - 24px);text-align:left}
.trash-btn:hover{border-color:#f44336;color:#f44336}
.trash-item{padding:10px 16px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--br)}
.trash-info{flex:1;min-width:0}
.trash-title{font-size:12px;color:var(--mt);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trash-date{font-size:10px;color:#444;margin-top:2px}
.restore-btn{padding:4px 10px;background:none;border:1px solid #9b7fe8;border-radius:4px;color:#9b7fe8;font-size:10px;cursor:pointer;white-space:nowrap;font-family:"Noto Sans KR",sans-serif}
.restore-btn:hover{background:rgba(155,127,232,.15)}
.perm-del-btn{padding:4px 10px;background:none;border:1px solid #444;border-radius:4px;color:#666;font-size:10px;cursor:pointer;white-space:nowrap;font-family:"Noto Sans KR",sans-serif;margin-left:4px}
.perm-del-btn:hover{border-color:#f44336;color:#f44336}
.stat{flex:1;text-align:center}
.stat-n{font-family:"Noto Serif KR",serif;font-size:17px;font-weight:700;color:var(--ac)}
.stat-l{font-size:9px;color:var(--mt);margin-top:1px;letter-spacing:1px}
.main{flex:1;display:flex;flex-direction:column;overflow:hidden;min-width:0;height:100vh;height:100dvh}
.tb{height:48px;background:#000;border-bottom:1px solid #222;display:flex;align-items:center;padding:0 12px;gap:6px;flex-shrink:0}
.tb-sb{background:none;border:none;color:var(--mt);cursor:pointer;font-size:18px;padding:4px 6px;border-radius:4px;flex-shrink:0;line-height:1}
.tb-sb:hover{color:var(--ac)}
.tb-title{font-family:"Noto Serif KR",serif;font-size:14px;color:#fff;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tab{padding:5px 12px;background:none;border:1px solid transparent;border-radius:5px;color:var(--mt);font-size:12px;cursor:pointer;transition:all .12s;white-space:nowrap;font-family:"Noto Sans KR",sans-serif}
.tab:hover{color:var(--sb);border-color:var(--br)}
.tab.on{background:var(--card);border-color:var(--br);color:#fff}
.refresh-btn{padding:5px 10px;background:none;border:1px solid #555;border-radius:5px;color:#fff;font-size:15px;cursor:pointer;transition:all .12s;white-space:nowrap;flex-shrink:0;line-height:1}
.refresh-btn:hover{border-color:#fff;background:rgba(255,255,255,.1)}
.cnt{flex:1;overflow-y:auto}
.pg{max-width:760px;margin:0 auto;padding:28px 20px}
.wlc{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;gap:14px;text-align:center;padding:0 32px}
.wlc-icon{animation:fl 4s ease-in-out infinite}
@keyframes fl{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.wlc-title{font-family:"Noto Serif KR",serif;font-size:22px;color:var(--ac)}
.wlc-sub{color:var(--mt);font-size:13px;line-height:1.9}
.n-title{width:100%;background:none;border:none;font-family:"Noto Serif KR",serif;font-size:22px;font-weight:700;color:#ffffff;outline:none;margin-bottom:12px}
.n-title::placeholder{color:rgba(155,127,232,.25)}
.gr{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:24px}
.gc{padding:3px 12px;border-radius:20px;border:1px solid var(--br);background:none;color:var(--mt);font-size:11px;cursor:pointer;transition:all .12s;font-family:"Noto Sans KR",sans-serif}
.gc.on{background:var(--ad);border-color:var(--ac);color:var(--ac)}
.genre-input-row{display:flex;align-items:center;gap:0;margin-bottom:10px;background:var(--card);border:1px solid var(--br);border-radius:8px;overflow:hidden;transition:border-color .15s}
.genre-input-row:focus-within{border-color:var(--ac)}
.genre-inp{flex:1;background:none;border:none;padding:8px 12px;color:#fff;font-family:"Noto Sans KR",sans-serif;font-size:13px;outline:none}
.genre-inp-btn{padding:8px 14px;background:none;border:none;border-left:1px solid var(--br);color:var(--ac);font-size:12px;cursor:pointer;white-space:nowrap;font-family:"Noto Sans KR",sans-serif;transition:background .12s}
.genre-inp-btn:hover{background:var(--ad)}
.genre-tag{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:20px;background:var(--ad);border:1px solid var(--ac);color:var(--ac);font-size:11px;margin:0 4px 6px 0}
.genre-tag-x{background:none;border:none;color:var(--ac);cursor:pointer;font-size:12px;padding:0;line-height:1;opacity:0.7}
.genre-tag-x:hover{opacity:1}
.synopsis-modal-bg{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.synopsis-modal{background:var(--card);border:1px solid var(--br);border-radius:14px;width:560px;max-width:94vw;max-height:85dvh;display:flex;flex-direction:column;overflow:hidden}
.synopsis-modal-head{padding:18px 20px;border-bottom:1px solid var(--br);display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.synopsis-modal-title{font-family:"Noto Serif KR",serif;font-size:16px;font-weight:700;color:var(--ac)}
.synopsis-modal-body{flex:1;overflow-y:auto;padding:20px}
.synopsis-view{font-size:14px;color:var(--sb);line-height:1.9;white-space:pre-wrap;min-height:80px}
.synopsis-view.empty{color:var(--mt);font-style:italic}
.synopsis-textarea{width:100%;background:var(--hv);border:1px solid var(--br);border-radius:8px;padding:12px;color:#fff;font-family:"Noto Sans KR",sans-serif;font-size:14px;outline:none;resize:none;line-height:1.9;min-height:340px}
.synopsis-textarea:focus{border-color:var(--ac)}
.synopsis-modal-foot{padding:14px 20px;border-top:1px solid var(--br);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
.synopsis-btn{padding:8px 18px;border-radius:6px;font-size:13px;cursor:pointer;font-family:"Noto Sans KR",sans-serif;border:none}
.gc-del{font-size:11px;opacity:0;margin-left:2px;transition:opacity .15s}
.gc:hover .gc-del{opacity:1}
.gc-add{padding:3px 12px;border-radius:20px;border:1px dashed var(--br);background:none;color:var(--mt);font-size:11px;cursor:pointer;transition:all .12s;font-family:"Noto Sans KR",sans-serif}
.gc-add:hover{border-color:var(--ac);color:var(--ac)}
.av-modal{position:fixed;inset:0;background:rgba(0,0,0,.8);display:flex;align-items:center;justify-content:center;z-index:300;backdrop-filter:blur(4px)}
.av-box{background:#111;border:1px solid #2a2a2a;border-radius:14px;padding:20px;width:360px;max-width:92vw;max-height:80vh;overflow-y:auto}
.av-box-title{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:700;color:#9b7fe8;margin-bottom:16px}
.av-group-label{font-size:10px;color:#666;letter-spacing:2px;text-transform:uppercase;margin:12px 0 6px}
.av-grid{display:flex;flex-wrap:wrap;gap:8px}
.av-item{width:42px;height:42px;border-radius:8px;border:2px solid transparent;background:#1a1a1a;display:flex;align-items:center;justify-content:center;font-size:22px;cursor:pointer;transition:all .12s}
.av-item:hover{border-color:#9b7fe8;background:#1a1025}
.av-item.on{border-color:#9b7fe8;background:#1a1025}
.av-close{float:right;background:none;border:none;color:#666;cursor:pointer;font-size:16px}
.sl{font-size:10px;letter-spacing:2px;text-transform:uppercase;color:#aaaaaa;margin-bottom:10px;padding-bottom:8px;border-bottom:1px solid var(--br)}
.chl{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.chc{background:var(--card);border:1px solid var(--br);border-radius:8px;padding:12px 16px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .12s}
.chc:hover{border-color:var(--ac);background:var(--hv)}
.chn{font-size:10px;color:#b8a4f0;font-family:"Noto Serif KR",serif;min-width:32px}
.chi{flex:1;min-width:0}
.chnm{font-size:13px;font-weight:500;color:#fff;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chwc{font-size:10px;color:var(--mt);margin-top:2px}
.chb{font-size:10px;padding:2px 8px;border-radius:10px;white-space:nowrap}
.bd{background:rgba(90,80,112,.25);color:var(--sb)}
.bdn{background:var(--ad);color:var(--ac)}
.gb{padding:10px;background:none;border:1px dashed var(--br);border-radius:7px;color:var(--mt);font-size:12px;cursor:pointer;width:100%;transition:all .12s;font-family:"Noto Sans KR",sans-serif}
.gb:hover{border-color:var(--ac);color:var(--ac)}
.ed{display:flex;flex-direction:column;height:100vh;height:100dvh;max-height:100dvh}
.ebar{height:48px;background:var(--sf);border-bottom:1px solid var(--br);display:flex;align-items:center;padding:0 10px;gap:6px;flex-shrink:0}
.bk{background:none;border:none;color:var(--mt);cursor:pointer;font-size:18px;padding:2px 6px;border-radius:4px;line-height:1}
.bk:hover{color:#fff}
.eti{background:none;border:none;font-family:"Noto Serif KR",serif;font-size:14px;color:#fff;outline:none;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.wcb{font-size:10px;background:var(--card);color:var(--mt);padding:3px 8px;border-radius:5px;white-space:nowrap;flex-shrink:0}
.db{padding:5px 12px;background:none;border:1px solid var(--ac);border-radius:5px;color:var(--ac);font-size:11px;cursor:pointer;white-space:nowrap;flex-shrink:0;font-family:"Noto Sans KR",sans-serif}
.db:hover{background:var(--ad)}
.eta{flex:1;min-height:0;padding:32px 24px;background:#000 !important;font-family:"Noto Sans KR",sans-serif;font-size:16px;color:#fff !important;-webkit-text-fill-color:#fff !important;line-height:2;outline:none;resize:none;border:none;overflow-y:auto;word-break:keep-all;-webkit-appearance:none;opacity:1 !important}
.eta::placeholder{color:rgba(255,255,255,.15) !important;-webkit-text-fill-color:rgba(255,255,255,.15) !important;font-style:italic}
.cgr{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:10px;margin-bottom:12px}
.cc{background:var(--card);border:1px solid var(--br);border-radius:9px;padding:14px;cursor:pointer;transition:all .12s}
.cc:hover{border-color:var(--ac);transform:translateY(-2px)}
.cav{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:18px;margin-bottom:8px}
.cnm{font-size:13px;font-weight:700;color:#fff}
.crl{font-size:10px;color:var(--mt);margin-top:2px}
.cds{font-size:11px;color:var(--sb);margin-top:6px;line-height:1.6}
.pb{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.pc{display:flex;flex-direction:column;gap:6px;min-width:0}
.pt{font-size:9px;letter-spacing:2px;text-transform:uppercase;color:var(--mt);padding-bottom:6px;border-bottom:1px solid var(--br)}
.pcd{background:var(--card);border:1px solid var(--br);border-radius:6px;padding:9px 10px;font-size:12px;color:var(--sb);line-height:1.6}
.pa{padding:6px;background:none;border:1px dashed var(--br);border-radius:5px;color:var(--mt);font-size:12px;cursor:pointer;width:100%;font-family:"Noto Sans KR",sans-serif;transition:all .12s}
.pa:hover{border-color:var(--ac);color:var(--ac)}
.mbg{position:fixed;inset:0;background:rgba(0,0,0,.75);display:flex;align-items:flex-start;justify-content:center;z-index:200;backdrop-filter:blur(4px);padding:20px 0;overflow-y:auto}
.md{background:var(--card);border:1px solid var(--br);border-radius:12px;padding:28px;width:560px;max-width:96vw;max-height:95dvh;overflow-y:auto}
.mdt{font-family:"Noto Serif KR",serif;font-size:15px;font-weight:700;color:var(--ac);margin-bottom:18px}
.fd{margin-bottom:12px}
.fd label{display:block;font-size:9px;color:var(--mt);margin-bottom:5px;letter-spacing:1.5px;text-transform:uppercase}
.fd input,.fd textarea,.fd select{width:100%;background:var(--hv);border:1px solid var(--br);border-radius:6px;padding:8px 10px;color:#fff;font-family:"Noto Sans KR",sans-serif;font-size:13px;outline:none}
.fd input:focus,.fd textarea:focus{border-color:var(--ac)}
.fd textarea{resize:vertical;min-height:200px}
.fd select{cursor:pointer}
.mbt{display:flex;gap:8px;justify-content:flex-end;margin-top:18px}
.bc{padding:7px 16px;background:none;border:1px solid var(--br);border-radius:6px;color:var(--mt);cursor:pointer;font-size:12px;font-family:"Noto Sans KR",sans-serif}
.bok{padding:7px 16px;background:var(--ac);border:none;border-radius:6px;color:#fff;cursor:pointer;font-size:12px;font-weight:700;font-family:"Noto Sans KR",sans-serif}
.toast{position:fixed;bottom:32px;left:50%;transform:translateX(-50%) translateY(20px);background:#1a1625;border:1px solid #9b7fe855;border-radius:10px;padding:10px 20px;font-size:12px;color:#9b7fe8;display:flex;align-items:center;gap:8px;z-index:500;opacity:0;transition:all .3s cubic-bezier(.4,0,.2,1);pointer-events:none;white-space:nowrap;box-shadow:0 4px 24px rgba(0,0,0,.5)}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast.ok{color:#7dd87d;border-color:#7dd87d44;background:#0d1a0d}
.toast.err{color:#f47c7c;border-color:#f47c7c44;background:#1a0d0d}
.dragging{opacity:0.4;transform:scale(0.97)}
.drag-over{border:2px solid var(--ac) !important;background:var(--ac) !important;opacity:0.3}
.cc{cursor:grab}.cc:active{cursor:grabbing}
.pcd{cursor:grab}.pcd:active{cursor:grabbing}
@media(min-width:900px){.pg{max-width:900px;padding:36px 48px}.n-title{font-size:26px}.eta{padding:48px 100px;font-size:17px}.pb{grid-template-columns:repeat(3,1fr)}.cgr{grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}}
.cover-area{width:120px;height:170px;border-radius:10px;border:2px dashed var(--br);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer;overflow:hidden;flex-shrink:0;transition:all .15s;background:var(--card)}
.cover-area:hover{border-color:var(--ac)}
.cover-area img{width:100%;height:100%;object-fit:cover}
.cover-label{font-size:10px;color:var(--mt);margin-top:6px;text-align:center;line-height:1.4}
.novel-header-row{display:flex;gap:20px;align-items:flex-start;margin-bottom:24px}
.novel-header-info{flex:1;min-width:0}
.char-detail-page{padding:0}
.char-detail-header{display:flex;flex-direction:column;align-items:center;padding:32px 20px 20px;border-bottom:1px solid var(--br);text-align:center}
.char-detail-avatar{width:120px;height:120px;border-radius:50%;object-fit:cover;margin-bottom:14px;cursor:pointer}
.char-detail-avatar-svg{width:120px;height:120px;margin-bottom:14px;cursor:pointer}
.char-detail-name{font-family:'Noto Serif KR',serif;font-size:22px;font-weight:700;color:#fff}
.char-detail-role{font-size:12px;color:var(--mt);margin-top:4px}
.char-detail-body{padding:20px}
.char-detail-desc{font-size:14px;color:var(--sb);line-height:1.9;white-space:pre-wrap}
.char-detail-actions{display:flex;gap:8px;margin-top:16px;justify-content:center}
.img-full-bg{position:fixed;inset:0;background:rgba(0,0,0,.92);display:flex;align-items:center;justify-content:center;z-index:400;cursor:pointer}
.img-full-bg img{max-width:90vw;max-height:90vh;border-radius:12px;object-fit:contain}
.cc{cursor:pointer}

@media(min-width:1200px){.eta{padding:56px 140px;font-size:18px}}
</style>
</head>
<body>
<div class="app">
  <aside class="sb" id="sb">
    <div class="sbh">
      <div class="logo">
        <svg width="18" height="14" viewBox="0 0 56 38" fill="none">
          <rect x="1" y="1" width="24" height="36" rx="2" stroke="#9b7fe8" stroke-width="2" fill="none"/>
          <rect x="31" y="1" width="24" height="36" rx="2" stroke="#9b7fe8" stroke-width="2" fill="none"/>
          <line x1="28" y1="1" x2="28" y2="37" stroke="#9b7fe8" stroke-width="2"/>
          <rect x="5" y="10" width="14" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
          <rect x="5" y="16" width="14" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
          <rect x="5" y="22" width="9" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
          <rect x="37" y="10" width="14" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
          <rect x="37" y="16" width="14" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
          <rect x="37" y="22" width="9" height="1.5" rx=".75" fill="#9b7fe8" opacity=".5"/>
        </svg>
        <div>작업노트<div class="logo-sub">NOVEL STUDIO</div></div>
      </div>
      <button class="x-btn" onclick="toggleSb()">✕</button>
    </div>
    <button class="new-btn" onclick="addNovel()">＋ 새 소설 시작</button>
    <div class="sb-list" id="sbl"></div>
    <button class="trash-btn" onclick="openTrash()" id="trash-btn">🗑 휴지통 <span id="trash-count"></span></button>
    <div class="sb-foot">

function resizeImage(file, maxW, maxH, quality){
  return new Promise(function(resolve){
    var reader=new FileReader();
    reader.onload=function(e){
      var img=new Image();
      img.onload=function(){
        var canvas=document.createElement('canvas');
        var w=img.width, h=img.height;
        if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
        if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
        canvas.width=w;canvas.height=h;
        var ctx=canvas.getContext('2d');
        ctx.drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg', quality||0.7));
      };
      img.src=e.target.result;
    };
    reader.readAsDataURL(file);
  });
}

  var tbtn=tabs.map(function(t){return '<button class="tab'+(D.tab===t[0]?' on':'')+'" onclick="setTab(\''+t[0]+'\')">'+t[1]+'</button>';}).join("");
  return '<div class="tb"><button class="tb-sb" onclick="toggleSb()">☰</button><span class="tb-title">'+e(n.title)+'</span>'+tbtn+'<button class="refresh-btn" onclick="refreshData()" title="새로고침">↺</button></div>'+
  '<div class="cnt"><div class="pg" id="tc"></div></div>';
}

function rTab(n){
  var el=document.getElementById("tc");if(!el)return;
  if(D.tab==="chapters")el.innerHTML=rCH(n);
  else if(D.tab==="characters")el.innerHTML=rCHAR(n);
  else el.innerHTML=rPLOT(n);
}

// 드래그앤드롭
var _dragType=null, _dragIdx=null;

function dragStart(e, type, idx){
  _dragType=type; _dragIdx=idx;
  e.currentTarget.classList.add('dragging');
  e.dataTransfer.effectAllowed='move';
}
function dragEnd(e){
  e.currentTarget.classList.remove('dragging');
  document.querySelectorAll('.drag-over').forEach(function(el){el.classList.remove('drag-over');});
}
function dragOver(e){
  e.preventDefault();
  e.dataTransfer.dropEffect='move';
  e.currentTarget.classList.add('drag-over');
}
function dropItem(e, type, toIdx){
  e.preventDefault();
  e.currentTarget.classList.remove('drag-over');
  if(_dragType!==type||_dragIdx===null||_dragIdx===toIdx)return;
  var n=nv();if(!n)return;
  var from=parseInt(_dragIdx), to=parseInt(toIdx);

  if(type==='char'){
    var arr=n.characters;
    var item=arr.splice(from,1)[0];
    arr.splice(to,0,item);
    n.characters=arr;
    saveNv(n); rTab(n);
  } else if(type.startsWith('plot_')){
    var col=type.replace('plot_','');
    var arr=n.plot[col];
    var item=arr.splice(from,1)[0];
    arr.splice(to,0,item);
    n.plot[col]=arr;
    saveNv(n); rTab(n);
  }
  _dragType=null; _dragIdx=null;
}

// 표지 업로드
function uploadCover(){
  var inp=document.createElement('input');
  inp.type='file';inp.accept='image/*';
  inp.onchange=function(){
    var file=inp.files[0];if(!file)return;
    var n=nv();if(!n)return;
    setSyncBar('표지 업로드 중...','');
    // 150x210으로 강하게 압축 (Firestore 1MB 제한 대응)
    resizeImage(file,150,210,0.6).then(function(url){
      n.cover=url;
      saveNv(n);rTab(n);rSB();
      setSyncBar('표지 저장됨 ✓','ok');
    }).catch(function(err){
      setSyncBar('오류: '+err.message,'err');
    });
  };
  inp.click();
}

// 이미지 전체화면
function viewFullImg(src, svgKey){
  var bg=document.createElement('div');
  bg.className='img-full-bg';
  bg.onclick=function(){bg.remove();};
  if(src){
    var img=document.createElement('img');
    img.src=src;
    bg.appendChild(img);
  } else if(svgKey){
    var div=document.createElement('div');
    div.style.cssText='width:280px;height:280px';
    div.innerHTML=makeSvgAvatar(svgKey);
    bg.appendChild(div);
  }
  document.body.appendChild(bg);
}


function updateTrashCount(){
  var el=document.getElementById("trash-count");
  if(el)el.textContent=D.trash.length?"("+D.trash.length+")":"";
}

function openTrash(){
  var html='<div class="mbg" id="trash-modal" onclick="if(event.target===this)closeTrash()">';
  html+='<div class="md" style="width:400px;max-height:80vh;overflow-y:auto">';
  html+='<div class="mdt" style="display:flex;justify-content:space-between;align-items:center">🗑 휴지통<button onclick="closeTrash()" style="background:none;border:none;color:#666;cursor:pointer;font-size:16px">✕</button></div>';
  if(!D.trash.length){
    html+='<p style="color:#444;font-size:13px;text-align:center;padding:20px 0">휴지통이 비어있어요</p>';
  } else {
    D.trash.forEach(function(t){
      var daysLeft=Math.ceil((20*24*60*60*1000-(Date.now()-t.deletedAt))/(24*60*60*1000));
      html+='<div class="trash-item"><div class="trash-info"><div class="trash-title">📖 '+e(t.title)+'</div><div class="trash-date">'+daysLeft+'일 후 자동 삭제</div></div>';
      html+='<button class="restore-btn" onclick="restoreN('+t.id+')">복원</button>';
      html+='<button class="perm-del-btn" onclick="permDelN('+t.id+')">영구삭제</button>';
      html+='</div>';
    });
  }
  html+='</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}

function closeTrash(){
  var el=document.getElementById("trash-modal");
  if(el)el.remove();
}

function restoreN(id){
  var t=D.trash.find(function(x){return x.id===id;});
  if(!t)return;
  delete t.deletedAt; delete t.type;
  D.novels.push(t);
  D.trash=D.trash.filter(function(x){return x.id!==id;});
  if(window._restoreFromTrash)window._restoreFromTrash(t);
  closeTrash();
  render();
  alert("복원됐어요!");
}

function permDelN(id){
  if(!confirm("영구 삭제하면 복구할 수 없어요. 정말 삭제할까요?"))return;
  D.trash=D.trash.filter(function(x){return x.id!==id;});
  if(window._permDelete)window._permDelete(id);
  closeTrash();openTrash();
  updateTrashCount();
}

  var n=nv();if(!n)return;n.title=v;rSB();

}
function addGenreInput(){
  var inp=document.getElementById('genre-inp');
  if(!inp)return;
  var val=inp.value.trim();
  if(!val)return;
  var n=nv();if(!n)return;
  if(!Array.isArray(n.genres))n.genres=n.genre?[n.genre]:[];
  if(n.genres.indexOf(val)<0){
    n.genres.push(val);
    n.genre=n.genres[0]||'';
    saveNv(n);rSB();
    // 태그 바로 업데이트
    var tags=document.getElementById('genre-tags');
    if(tags){
      var span=document.createElement('span');
      span.className='genre-tag';
      span.innerHTML=e(val)+'<button class="genre-tag-x" onclick="removeGenre(\''+val+'\')">×</button>';
      tags.appendChild(span);
    }
  }
  inp.value='';
  inp.focus();
}
function removeGenre(g){
  var n=nv();if(!n)return;
  if(!Array.isArray(n.genres))return;
  n.genres=n.genres.filter(function(x){return x!==g;});
  n.genre=n.genres[0]||'';
  saveNv(n);rSB();
  // 태그 바로 제거
  var tags=document.getElementById('genre-tags');
  if(tags){
    var items=tags.querySelectorAll('.genre-tag');
    items.forEach(function(el){if(el.textContent.replace('×','').trim()===g)el.remove();});
  }
}

  html+='📷 이미지 선택<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"/></label>';
  html+='<span id="upload-status" style="font-size:11px;color:#666;margin-left:8px"></span>';
  html+='</div><div style="border-top:1px solid #2a2a2a;margin-bottom:12px"></div>';

  AV_GROUPS.forEach(function(g){
    html+='<div class="av-group-label">'+g.label+'</div>';
    html+='<div class="av-grid">';
    g.items.forEach(function(item){
      var svgStr=makeSvgAvatar(item);
      var label=SVG_AVATARS[item]?SVG_AVATARS[item][4]:'';
      html+='<div class="av-item'+(cur===item?' on':'')+'" onclick="selectAv(\''+item+'\')" title="'+label+'" style="flex-direction:column;gap:3px;width:52px;height:60px;font-size:10px;color:#999">';
      html+='<div style="width:40px;height:40px">'+svgStr+'</div>';
      html+='<span>'+label+'</span>';
      html+='</div>';
    });
    html+='</div>';
  });
  html+='</div></div>';
  document.body.insertAdjacentHTML('beforeend', html);
}
function uploadAvatar(input){
  var file=input.files[0];if(!file)return;
  var st=document.getElementById('upload-status');
  if(st)st.textContent='업로드 중...';
  resizeImage(file,120,120,0.7).then(function(url){
    if(st)st.textContent='✓ 완료!';
    var prev=document.getElementById('av-preview');
    var inp=document.getElementById('mav');
    if(prev)prev.innerHTML='<img src="'+url+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover"/>';
    if(inp)inp.value=url;
    setTimeout(function(){if(st)st.textContent='';},1500);
  }).catch(function(err){
    if(st)st.textContent='오류: '+err.message;
  });
}
function selectAv(av){
  var inp=document.getElementById("mav");
  var prev=document.getElementById("av-preview");
  if(inp)inp.value=av;
  if(prev){
    if(av&&av.startsWith('data:')){
      prev.innerHTML='<img src="'+av+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover"/>';
    } else if(SVG_AVATARS[av]){
      prev.innerHTML='<div style="width:48px;height:48px">'+makeSvgAvatar(av)+'</div>';
    } else {
      prev.textContent=av;
    }
  }
  closeAvModal();
}
function closeAvModal(){
  var el=document.getElementById("av-modal");
  if(el)el.remove();
}
function delChar(id){
  var n=nv();if(!n)return;
  if(!confirm("이 인물을 삭제할까요?"))return;
  n.characters=n.characters.filter(function(c){return c.id!==id;});
  saveNv(n);render();
}
function delPlot(col,idx){
  var n=nv();if(!n)return;
  if(!confirm("이 플롯 카드를 삭제할까요?"))return;
  n.plot[col].splice(idx,1);
  saveNv(n);rTab(n);
}
function editPlot(col,idx){
  var n=nv();if(!n)return;
  var cur=n.plot[col][idx];
  document.getElementById("mt").textContent=col+" — 플롯 수정";
  document.getElementById("mb").innerHTML='<div class="fd"><label>사건 / 장면</label><textarea id="mpt" style="min-height:120px">'+e(cur)+'</textarea></div>';
  window._modalCb=function(){
    var t=document.getElementById("mpt").value;
    if(t.trim()){n.plot[col][idx]=t;saveNv(n);}
  };
  document.getElementById("modal").style.display="flex";
}
function delN(id){
  if(!confirm("이 소설을 휴지통으로 이동할까요?\n20일 후 자동 삭제됩니다."))return;
  var n=D.novels.find(function(x){return x.id===id;});
  if(!n)return;
  n.deletedAt=Date.now();
  n.type="novel";
  D.trash.push(JSON.parse(JSON.stringify(n)));
  D.novels=D.novels.filter(function(x){return x.id!==id;});
  if(D.sel===id){D.sel=null;D.ech=null;}
  if(window._moveToTrash)window._moveToTrash(n);
  render();
}
function addNovel(){
  var id=uid(),p={};
  PC.forEach(function(k){p[k]=[];});
  var n={id:id,title:"새 소설",genre:"판타지",chapters:[],characters:[],plot:p};
  D.novels.push(n);
  D.sel=id;D.ech=null;D.tab="chapters";
  saveNv(n);
  render();
}

function addCH(){
  var n=nv();if(!n)return;
  var id=uid(),num=n.chapters.length+1;
  n.chapters.push({id:id,title:num+"장 — 제목",content:"",status:"draft"});
  D.ech=id;saveNv(n);rMN();
}

function openCM(cid){
  var n=nv();if(!n)return;
  var c=cid?n.characters.find(function(x){return x.id===cid;}):null;
  document.getElementById("mt").textContent=c?"인물 편집":"인물 추가";
  var curAv=c?c.avatar:"f_girl";
  var initAvHtml;
  if(curAv&&curAv.startsWith('data:')){
    initAvHtml='<img src="'+curAv+'" style="width:48px;height:48px;border-radius:50%;object-fit:cover"/>';
  } else if(SVG_AVATARS[curAv]){
    initAvHtml='<div style="width:48px;height:48px">'+makeSvgAvatar(curAv)+'</div>';
  } else {
    initAvHtml='<div style="width:48px;height:48px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:26px">'+(c?c.avatar:'⚔️')+'</div>';
  }
  document.getElementById("mb").innerHTML=
    '<div class="fd"><label>프로필 이미지</label>'+
    '<div style="display:flex;align-items:center;gap:12px">'+
    '<div id="av-preview">'+initAvHtml+'</div>'+
    '<label style="display:inline-flex;align-items:center;gap:6px;padding:7px 12px;background:none;border:1px solid #9b7fe8;border-radius:6px;color:#9b7fe8;font-size:12px;cursor:pointer">'+
    '📷 이미지 선택<input type="file" accept="image/*" style="display:none" onchange="uploadAvatar(this)"/></label>'+
    '<span id="upload-status" style="font-size:11px;color:#666"></span>'+
    '</div></div>'+
    '<input type="hidden" id="mav" value="'+(c?e(c.avatar):"⚔️")+'"/>'+
    '<div class="fd"><label>이름</label><input id="mi" value="'+(c?e(c.name):"")+'"/></div>'+
    '<div class="fd"><label>역할</label><select id="mr">'+RL.map(function(r){return '<option'+(c&&c.role===r?' selected':'')+'>'+r+'</option>';}).join("")+'</select></div>'+
    '<div class="fd"><label>소개</label><textarea id="md">'+(c?e(c.desc):"")+'</textarea></div>';
  mcb=function(){
    var nm=document.getElementById("mi").value,rl=document.getElementById("mr").value,ds=document.getElementById("md").value,av=document.getElementById("mav").value||"⚔️";
    if(c){c.name=nm;c.role=rl;c.desc=ds;c.avatar=av;}
    else{n.characters.push({id:uid(),name:nm,role:rl,desc:ds,avatar:av,color:AC[Math.floor(Math.random()*AC.length)]});}
    saveNv(n);
  };
  document.getElementById("modal").style.display="flex";
}

function openPM(col){
  var n=nv();if(!n)return;
  document.getElementById("mt").textContent=col+" — 플롯 추가";
  document.getElementById("mb").innerHTML='<div class="fd"><label>사건 / 장면</label><textarea id="mpt" placeholder="핵심 사건을 적어주세요"></textarea></div>';
  mcb=function(){
    var t=document.getElementById("mpt").value;
    if(t.trim()){n.plot[col].push(t);saveNv(n);}
  };
  document.getElementById("modal").style.display="flex";
}

function saveM(){var cb=mcb||window._modalCb;if(cb){cb();mcb=null;window._modalCb=null;}closeM();render();}
function closeM(){
  document.getElementById('modal').style.display='none';
  var mbt=document.getElementById('modal').querySelector('.mbt');
  if(mbt)mbt.style.display='flex';
  mcb=null;window._modalCb=null;
}

render();
setTimeout(fixBrokenImages, 1000);
</script>
</body>
</html>
